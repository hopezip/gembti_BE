[project]
name = "gembti-be"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"


dependencies = [
    # -----------------------------------------------
    # FastAPI 웹 프레임워크
    # -----------------------------------------------
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",

    # -----------------------------------------------
    # SQLAlchemy + PostgreSQL 드라이버
    # -----------------------------------------------
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",                # async 드라이버 (FastAPI용)
    "psycopg2-binary>=2.9.9",         # sync 드라이버 (Celery용)
    "alembic>=1.13.0",
    "pgvector>=0.2.5",

    # -----------------------------------------------
    # Redis + Celery
    # -----------------------------------------------
    "redis>=5.0.0",
    "celery[redis]>=5.3.6",

    # -----------------------------------------------
    # 인증 / 보안
    # -----------------------------------------------
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "slowapi>=0.1.9",

    # -----------------------------------------------
    # Pydantic + 환경변수 관리
    # -----------------------------------------------
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",

    # -----------------------------------------------
    # OpenAI API (LLM + 임베딩)
    # -----------------------------------------------
    "openai>=1.30.0",

    # -----------------------------------------------
    # 추천 알고리즘
    # -----------------------------------------------
    "numpy>=1.26.0",

    # -----------------------------------------------
    # AWS S3
    # -----------------------------------------------
    "boto3>=1.34.0",

    # -----------------------------------------------
    # HTTP 클라이언트 (Steam Web API)
    # -----------------------------------------------
    "httpx>=0.27.0",

    # -----------------------------------------------
    # 이메일 전송
    # -----------------------------------------------
    "fastapi-mail>=1.4.1",

    # -----------------------------------------------
    # 유틸리티
    # -----------------------------------------------
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
]

# -----------------------------------------------
# 빌드 시스템
# hatchling이 app/ 폴더를 패키지로 인식하도록 명시
# -----------------------------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]                  # app/ 폴더를 패키지로 지정

# -----------------------------------------------
# 개발 의존성 (tool.uv.dev-dependencies deprecated)
# dependency-groups 로 변경
# -----------------------------------------------
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

# -----------------------------------------------
# black 포맷터 설정
# -----------------------------------------------
[tool.black]
line-length = 100
target-version = ["py312"]
skip-string-normalization = false
exclude = '''
/(
    \.git
  | \.venv
  | alembic/versions
)/
'''

# -----------------------------------------------
# isort import 정렬 설정
# -----------------------------------------------
[tool.isort]
profile = "black"                   # black과 충돌 방지
line_length = 100
known_first_party = ["app"]
known_third_party = [
    "fastapi",
    "sqlalchemy",
    "pydantic",
    "celery",
    "redis",
    "openai",
    "numpy",
    "httpx",
    "alembic",
]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
force_sort_within_sections = true
combine_as_imports = true
skip = ["alembic/versions", ".venv"]
skip_glob = [".venv/*", "*/site-packages/*"]

# -----------------------------------------------
# ruff 린터 설정 (포맷팅은 black이 담당)
# -----------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".git", ".venv", "alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]
ignore = [
    "E501",   # 줄 길이 — black이 관리
    "B008",   # FastAPI Depends() 허용
    "SIM108", # 삼항 연산자 강제 비활성화
]

[tool.ruff.lint.per-file-ignores]
"tests/*"   = ["S101", "F401"]
"alembic/*" = ["F401"]

# -----------------------------------------------
# pytest 설정
# -----------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--cov=app --cov-report=term-missing"

# -----------------------------------------------
# mypy 타입 체커 설정
# -----------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
exclude = ["alembic/"]