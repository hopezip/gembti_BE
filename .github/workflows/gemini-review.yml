name: "Gemini 2.5 Direct Code Review"

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read

jobs:
  gemini-review:
    runs-on: ubuntu-latest
    steps:
      # 1. Repository 체크아웃
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. PR의 코드 변경점(Diff) 추출
      - name: Extract PR Diff
        id: get_diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt
          echo "DIFF_SIZE=$(wc -c < pr_diff.txt)" >> $GITHUB_ENV

      # 3. Python 환경 세팅
      - name: Set up Python
        if: env.DIFF_SIZE != '0'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ➡️ [수정됨] 에러를 해결하기 위해 requests 모듈을 설치합니다.
      - name: Install Dependencies
        if: env.DIFF_SIZE != '0'
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 4. Gemini 2.5 API 직접 호출 및 PR 댓글 작성
      - name: Request Gemini 2.5 Review
        if: env.DIFF_SIZE != '0'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          python -c "
          import os, requests, json

          api_key = os.getenv('GEMINI_API_KEY')
          github_token = os.getenv('GITHUB_TOKEN')
          pr_num = os.getenv('PR_NUMBER')
          repo = os.getenv('REPO')

          if not api_key:
              print('에러: GEMINI_API_KEY가 없습니다. Repository Secrets를 확인하세요.')
              exit(1)

          with open('pr_diff.txt', 'r', encoding='utf-8') as f:
              diff_content = f.read()

          if len(diff_content) > 40000:
              diff_content = diff_content[:40000] + '\n... (코드가 너무 길어 뒷부분은 생략되었습니다) ...'

          # Google AI Studio 공식 Gemini 2.5 API 엔드포인트 다이렉트 호출
          url = f'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key={api_key}'
          headers = {'Content-Type': 'application/json'}
          
          prompt = f'당신은 시니어 백엔드 소프트웨어 엔지니어입니다. 아래 Git Diff(코드 변경 사항)를 보고, 잠재적인 버그 코드, 예외 처리 미비, 리팩토링 포인트를 꼼꼼하게 분석하여 한국어로 친절하게 깃허브 코드 리뷰 댓글을 작성해 주세요:\n\n{diff_content}'
          
          payload = {'contents': [{'parts': [{'text': prompt}]}]}
          
          print('Gemini API 요청 중...')
          res = requests.post(url, headers=headers, json=payload)
          
          if res.status_code != 200:
              print(f'Gemini API 에러 발생 ({res.status_code}):', res.text)
              exit(1)
              
          res_json = res.json()
          try:
              review_text = res_json['candidates'][0]['content']['parts'][0]['text']
          except Exception as e:
              print('Gemini 응답 파싱 실패:', res_json)
              exit(1)

          # GitHub API를 사용해 PR에 다이렉트로 댓글 등록
          gh_url = f'https://api.github.com/repos/{repo}/issues/{pr_num}/comments'
          gh_headers = {
              'Authorization': f'token {github_token}',
              'Accept': 'application/vnd.github.v3+json'
          }
          
          print('GitHub PR에 리뷰 댓글 작성 중...')
          gh_res = requests.post(gh_url, headers=gh_headers, json={'body': review_text})
          
          if gh_res.status_code not in [200, 201]:
              print(f'GitHub 댓글 작성 실패 ({gh_res.status_code}):', gh_res.text)
              exit(1)
              
          print('코드 리뷰 등록 성공!')
          "