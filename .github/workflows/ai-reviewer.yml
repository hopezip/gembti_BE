name: "Run ai-reviewer"

permissions:
  pull-requests: write
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  run-review:
    runs-on: ubuntu-latest
    steps:
      - name: Gemini Review Bot
        uses: Nasubikun/ai-reviewer@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LANGUAGE: "Korean"
          EXCLUDE_PATHS: "**/pnpm-lock.yaml"
          # ◀ 2.5 계열을 쓰시려면 아래 두 가지 중 하나를 선택하세요 ▶
          MODEL_CODE: "gemini-2.5-flash"  # 빠르고 안정적인 기본 2.5 모델
          # 만약 더 깊이 있는 백엔드 코드 논리 분석을 원하신다면: "gemini-2.5-pro"