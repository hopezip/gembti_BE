# 로컬 개발 전용 — 인프라(PostgreSQL + Redis)만 기동
# 앱·Celery는 로컬에서 직접 실행 (핫리로드 최적)
#
# 사용법:
#   docker compose -f docker-compose.infra.yml up -d
#   uv run uvicorn app.main:app --reload
#   uv run celery -A app.core.celery_app worker --loglevel=debug

services:

  # ── PostgreSQL + pgvector ──────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: gembti_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gembti
      POSTGRES_PASSWORD: gembti
      POSTGRES_DB: gembti
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gembti"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: gembti_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
