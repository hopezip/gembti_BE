upstream fastapi {
    server app:8000;
}

# ── HTTP → HTTPS 리다이렉트 ────────────────────────────
server {
    listen 80;
    server_name gembti.cloud www.gembti.cloud;
    return 301 https://$host$request_uri;
}

# ── HTTPS ─────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name gembti.cloud www.gembti.cloud;

    ssl_certificate     /etc/letsencrypt/live/gembti.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gembti.cloud/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 10M;

    # ── API ───────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://fastapi;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE 스트리밍 (고객센터 챗봇 text/event-stream)
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
    }

    # ── 헬스체크 ──────────────────────────────────────────
    location /health {
        proxy_pass http://fastapi;
    }

    # ── 개발 문서 (DEBUG=True 일 때만 FastAPI가 응답) ──────
    location /docs {
        proxy_pass http://fastapi;
    }

    location /redoc {
        proxy_pass http://fastapi;
    }

    location /openapi.json {
        proxy_pass http://fastapi;
    }
}