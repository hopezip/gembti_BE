[alembic]
# 마이그레이션 스크립트 위치
script_location = alembic

# 파일명 패턴: YYYY-MM-DD_HH-MM-SS_slug.py
file_template = %%(year)d-%%(month).2d-%%(day).2d_%%(hour).2d-%%(minute).2d-%%(second).2d_%%(slug)s

# .env 로드 — env.py에서 직접 처리하므로 여기선 비워 둠
# sqlalchemy.url = (env.py에서 DATABASE_SYNC_URL을 동적으로 주입)

prepend_sys_path = .

# 마이그레이션 출력 인코딩
output_encoding = utf-8

[post_write_hooks]
# ruff 자동 포맷
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
